name: Procesar PDF del correo
on:
  workflow_dispatch:
  schedule:
    - cron: '17 13,19 * * *'
concurrency:
  group: procesar-pdfs
  cancel-in-progress: false
jobs:
  ejecutar:
    if: github.event_name == 'workflow_dispatch' || vars.PROCESAMIENTO_ACTIVO == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Leer PDF y actualizar Sheets
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_SPREADSHEET_ID: ${{ vars.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_SHEET_TAB: ${{ vars.GOOGLE_SHEET_TAB }}
          GMAIL_QUERY: ${{ vars.GMAIL_QUERY }}
          EMAIL_PROVIDER: gmail
          TABLE_PROVIDER: google_sheets
        run: python -m depurador
